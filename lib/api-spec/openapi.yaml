openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /fitness/pages:
    get:
      operationId: getFitnessPage
      summary: Read data for an original fitness screen
      parameters:
        - in: query
          name: screen
          required: true
          schema:
            type: string
            enum: [calendar, program, analysis, benchmarks, settings]
        - in: query
          name: from
          schema: { type: string }
        - in: query
          name: to
          schema: { type: string }
      responses:
        "200":
          description: Original screen data, with calendar days serialized as entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessPage" }
        "401": { description: Family sign-in required }
        "503": { description: Database or password configuration missing }
  /fitness/actions/{action}:
    post:
      operationId: fitnessAction
      summary: Perform an existing coach action
      parameters:
        - in: path
          name: action
          required: true
          schema:
            type: string
            enum: [propose, approve, approveAll, unapprove, swap, setLocation, skip, insert, neverPropose, replan, savePolicyAction, resetPolicyAction, usePublishedProfileAction, move, setCap, setRepeat, setWarmUp, saveWarmUpTemplate, deleteWarmUpTemplate]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FitnessForm" }
      responses:
        "200":
          description: Saved; reload the current screen or follow redirect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessActionResult" }
        "400": { description: Invalid form input }
        "401": { description: Family sign-in required }
  /fitness/login:
    post:
      operationId: familyLogin
      summary: Sign in with your name and password (the coach may use the family password until they set their own)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FamilyCredentials" }
      responses:
        "200":
          description: Signed in with an HTTP-only session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessActionResult" }
        "401": { description: Name or password did not match }
        "429": { description: Too many attempts }
  /fitness/logout:
    post:
      operationId: logout
      summary: Sign out on this device
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessActionResult" }
  /fitness/me:
    get:
      operationId: getMe
      summary: The signed-in person and who they may log results for
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessPage" }
        "401": { description: Sign-in required }
  /fitness/account/password:
    post:
      operationId: changeMyPassword
      summary: Change your own password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "200":
          description: Password changed; other devices are signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessActionResult" }
        "400": { description: Invalid password }
        "401": { description: Current password did not match }
  /fitness/athletes:
    get:
      operationId: listFamily
      summary: Family members and whether each has a password (coach only)
      responses:
        "200":
          description: Family members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessPage" }
        "403": { description: Coach only }
  /fitness/athletes/{athleteId}/password:
    post:
      operationId: setAthletePassword
      summary: Set a family member's password (coach only)
      parameters:
        - in: path
          name: athleteId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordSet" }
      responses:
        "200":
          description: Password set; that person's other devices are signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessActionResult" }
        "403": { description: Coach only }
  /fitness/athletes/{athleteId}/profile:
    post:
      operationId: setLoadProfile
      summary: Set a person's standing load setting as a percent of the standard Rx per kind of equipment (coach only)
      parameters:
        - { in: path, name: athleteId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoadProfileInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessActionResult" }
        "403": { description: Coach only }
  /fitness/versions:
    post:
      operationId: setAthleteVersion
      summary: Set (or reset) one person's weights for one program day (coach only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AthleteVersionInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessActionResult" }
        "403": { description: Coach only }
  /fitness/today:
    get:
      operationId: getToday
      summary: The planned workout for a date and what the athlete logged that day
      parameters:
        - { in: query, name: date, required: true, schema: { type: string } }
        - { in: query, name: athleteId, schema: { type: string } }
      responses:
        "200":
          description: Today
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessPage" }
  /fitness/coaching-note:
    get:
      operationId: getCoachingNote
      summary: AI-written plan for one person on one program day (note is null when AI notes are off or unavailable)
      parameters:
        - { in: query, name: dayId, required: true, schema: { type: string } }
        - { in: query, name: athleteId, schema: { type: string } }
      responses:
        "200":
          description: Coaching note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessPage" }
  /fitness/plan-note:
    post:
      operationId: setPlanNote
      summary: Coach replaces one person's "Plan for today" on a program day (empty text goes back to the suggested plan)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanNoteInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessPage" }
  /fitness/warm-up-templates:
    get:
      operationId: getWarmUpTemplates
      summary: The coach's saved warm-ups
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessPage" }
  /fitness/library:
    get:
      operationId: getLibrary
      summary: Coach - the workout library's counts and the workouts it does not propose (with reasons)
      parameters:
        - { in: query, name: offset, schema: { type: integer } }
      responses:
        "200":
          description: Library report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessPage" }
  /fitness/library/import:
    post:
      operationId: importLibrary
      summary: Coach - add the bundled workout library to the database (additive, safe to repeat)
      responses:
        "200":
          description: Import report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessPage" }
  /fitness/knowledge:
    get:
      operationId: getKnowledge
      summary: Coach - Chalkboard's knowledge cards with the coach's statuses, current settings and how often each rule fired
      responses:
        "200":
          description: Knowledge map
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessPage" }
  /fitness/knowledge/card:
    post:
      operationId: setKnowledgeCard
      summary: Coach - change a card's status or note
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeCardInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessPage" }
  /fitness/knowledge/ask:
    post:
      operationId: askKnowledge
      summary: Coach - ask Chalkboard a question; answered only from its knowledge and the plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeQuestionInput" }
      responses:
        "200":
          description: Answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessPage" }
  /fitness/knowledge/movements:
    get:
      operationId: getKnowledgeMovements
      summary: Coach - every movement with its facts and how often it has been done
      responses:
        "200":
          description: Movements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessPage" }
  /fitness/knowledge/movement:
    get:
      operationId: getKnowledgeMovement
      summary: Coach - one movement's facts, points of performance, versions and workouts
      parameters:
        - { in: query, name: key, required: true, schema: { type: string } }
      responses:
        "200":
          description: Movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessPage" }
  /fitness/knowledge/teach:
    post:
      operationId: teachKnowledge
      summary: Coach - teach Chalkboard (or correct a draft); returns the draft, conflicts and a dry-run preview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeachInput" }
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessPage" }
  /fitness/knowledge/teach/decide:
    post:
      operationId: decideTeaching
      summary: Coach - confirm, confirm as coach decision, discard or undo a teaching
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeachDecision" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessPage" }
  /fitness/history:
    get:
      operationId: getHistory
      summary: An athlete's results, newest first
      parameters:
        - { in: query, name: athleteId, schema: { type: string } }
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: offset, schema: { type: integer } }
        - { in: query, name: limit, schema: { type: integer } }
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessPage" }
  /fitness/workout:
    get:
      operationId: getWorkoutDetail
      summary: A workout and the athlete's results on it
      parameters:
        - { in: query, name: workoutId, required: true, schema: { type: string } }
        - { in: query, name: athleteId, schema: { type: string } }
      responses:
        "200":
          description: Workout detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessPage" }
        "404": { description: Not found }
  /fitness/workout-search:
    get:
      operationId: searchWorkouts
      summary: Find a library workout to log (when not doing the planned one)
      parameters:
        - { in: query, name: q, required: true, schema: { type: string } }
      responses:
        "200":
          description: Matching workouts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessPage" }
  /fitness/results:
    post:
      operationId: logResult
      summary: Log a result
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogResultInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessActionResult" }
        "400": { description: Invalid score }
        "403": { description: Not allowed for this athlete }
  /fitness/results/{resultId}:
    delete:
      operationId: deleteResult
      summary: Delete a result entered in the app
      parameters:
        - { in: path, name: resultId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FitnessActionResult" }
        "403": { description: Not allowed }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    FitnessPage:
      type: object
      additionalProperties: true
    TeachInput:
      type: object
      properties:
        text: { type: string }
        teachingId: { type: string }
        correction: { type: string }
    TeachDecision:
      type: object
      required: [teachingId, action]
      properties:
        teachingId: { type: string }
        action: { type: string, enum: [confirm, override, discard, undo] }
    KnowledgeQuestionInput:
      type: object
      required: [question]
      properties:
        question: { type: string }
    KnowledgeCardInput:
      type: object
      required: [cardId]
      properties:
        cardId: { type: string }
        status: { type: string, enum: [confirmed, proposed, disputed, gap, methodology] }
        note: { type: string }
    PlanNoteInput:
      type: object
      required: [dayId, athleteId, text]
      properties:
        dayId: { type: string }
        athleteId: { type: string }
        text: { type: string }
    FitnessForm:
      type: object
      additionalProperties:
        oneOf:
          - { type: string }
          - type: array
            items: { type: string }
    FamilyCredentials:
      type: object
      required: [name, password]
      properties:
        name: { type: string }
        password: { type: string }
        next: { type: string }
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string }
    PasswordSet:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string }
    LoadProfileInput:
      type: object
      properties:
        barbell: { type: number }
        dumbbell: { type: number }
        kettlebell: { type: number }
        medball: { type: number }
    AthleteVersionInput:
      type: object
      required: [dayId, athleteId]
      properties:
        dayId: { type: string }
        athleteId: { type: string }
        reset: { type: boolean }
        loads:
          type: array
          items:
            type: object
            required: [index, value]
            properties:
              index: { type: integer }
              value: { type: number }
    LogResultInput:
      type: object
      required: [athleteId, date, workoutId, asPrescribed, completed, score]
      properties:
        athleteId: { type: string }
        date: { type: string }
        workoutId: { type: string }
        dayId: { type: string }
        asPrescribed: { type: boolean }
        completed: { type: boolean }
        score:
          type: object
          properties:
            timeSec: { type: number }
            rounds: { type: number }
            reps: { type: number }
            loads: { type: array, items: { type: number } }
            distanceM: { type: number }
            calories: { type: number }
        loads:
          type: array
          items:
            type: object
            required: [index, value]
            properties:
              index: { type: integer }
              value: { type: number }
              unit: { type: string, enum: [lb, kg] }
        scaling: { type: string }
        notes: { type: string }
    FitnessActionResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        redirect: { type: string }
        id: { type: string }
        comparison:
          type: object
          additionalProperties: true
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

